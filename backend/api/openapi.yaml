openapi: 3.0.3
info:
  title: Tax Return Organizer API
  version: 0.1.0
  description: REST API consumed by the SvelteKit BFF. Authentication is not implemented yet.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Does not check dependencies such as the database.
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /collectors:
    post:
      operationId: createCollector
      summary: Create a collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectorRequest"
      responses:
        "201":
          description: The collector was created.
          headers:
            Location:
              description: Path of the new collector.
              schema:
                type: string
                example: /collectors/k7m2
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCollectorResponse"
        "400":
          description: Malformed body, unknown field, empty name or invalid email address.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error. Details are only logged, quote the request id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /collectors/{id}:
    get:
      operationId: getCollector
      summary: Get a collector by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[2-9a-hj-km-np-z]{4}$"
            example: k7m2
      responses:
        "200":
          description: The collector.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCollectorResponse"
        "400":
          description: The id is not a valid collector id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No collector with this id exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error. Details are only logged, quote the request id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    RequestID:
      description: Identifies the request in the server logs.
      schema:
        type: string
        format: uuid
  schemas:
    CreateCollectorRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          description: Must not be blank after trimming.
          example: Jane Doe
        email:
          type: string
          description: Plain address. Display names such as "Jane <jane@example.com>" are rejected.
          example: jane@example.com
    CreateCollectorResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: "^[2-9a-hj-km-np-z]{4}$"
          example: k7m2
    GetCollectorResponse:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          pattern: "^[2-9a-hj-km-np-z]{4}$"
          example: k7m2
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane@example.com
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
