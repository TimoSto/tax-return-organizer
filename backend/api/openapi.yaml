openapi: 3.0.3
info:
  title: Tax Return Organizer API
  version: 0.1.0
  description: REST API consumed by the SvelteKit BFF. Authentication is not implemented yet.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Does not check dependencies such as the database.
      responses:
        "200":
          description: The service is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /collectors:
    post:
      operationId: createCollector
      summary: Create a collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectorRequest"
      responses:
        "201":
          description: The collector was created.
          headers:
            Location:
              description: Path of the new collector.
              schema:
                type: string
                example: /collectors/k7m2
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCollectorResponse"
        "400":
          description: Malformed body, unknown field, empty name, invalid email address or unknown locale.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error. Details are only logged, quote the request id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /collectors/{id}:
    get:
      operationId: getCollector
      summary: Get a collector by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[2-9a-hj-km-np-z]{4}$"
            example: k7m2
      responses:
        "200":
          description: The collector.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCollectorResponse"
        "400":
          description: The id is not a valid collector id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No collector with this id exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error. Details are only logged, quote the request id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /collectors/{collectorId}/personas/{id}:
    get:
      operationId: getPersona
      summary: Get a persona of a collector by id
      description: A persona that belongs to another collector is reported as not found.
      parameters:
        - name: collectorId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[2-9a-hj-km-np-z]{4}$"
            example: k7m2
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The persona.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPersonaResponse"
        "400":
          description: The collector id or the persona id is invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The collector has no persona with this id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error. Details are only logged, quote the request id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    RequestID:
      description: Identifies the request in the server logs.
      schema:
        type: string
        format: uuid
  schemas:
    CreateCollectorRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          description: Must not be blank after trimming.
          example: Jane Doe
        email:
          type: string
          description: Plain address. Display names such as "Jane <jane@example.com>" are rejected.
          example: jane@example.com
        locale:
          type: string
          enum: [en, de]
          default: en
          description: Language of the predefined personas the new collector starts with.
    CreateCollectorResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: "^[2-9a-hj-km-np-z]{4}$"
          example: k7m2
    GetCollectorResponse:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          pattern: "^[2-9a-hj-km-np-z]{4}$"
          example: k7m2
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane@example.com
    GetPersonaResponse:
      type: object
      required: [id, collectorId, name, description, items]
      properties:
        id:
          type: string
          format: uuid
        collectorId:
          type: string
          pattern: "^[2-9a-hj-km-np-z]{4}$"
          example: k7m2
        name:
          type: string
          example: Employed
        description:
          type: string
          description: May be empty.
          example: Has a job
        items:
          type: array
          description: The item definitions of the persona in the order the collector arranged them. May be empty.
          items:
            $ref: "#/components/schemas/ItemDefinition"
    ItemDefinition:
      type: object
      description: >
        Something the persona asks the client to provide. A document item has a documentSpec and a null
        valueSpec, a data item the reverse.
      required: [id, title, kind, recurrence, documentSpec, valueSpec]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Payslip
        kind:
          type: string
          enum: [document, data]
        recurrence:
          type: string
          enum: [monthly, quarterly, semiannually, annually]
        documentSpec:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DocumentSpec"
        valueSpec:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ValueSpec"
    DocumentSpec:
      type: object
      required: [metadataFields]
      properties:
        metadataFields:
          type: array
          items:
            type: object
            required: [name, valueSpec]
            properties:
              name:
                type: string
                example: Employer
              valueSpec:
                $ref: "#/components/schemas/ValueSpec"
    ValueSpec:
      type: object
      required: [type, unit, required]
      properties:
        type:
          type: string
          enum: [text, number, date, bool]
        unit:
          type: string
          description: Optional free-text display label such as EUR or days. Empty if there is none.
          example: EUR
        required:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
