version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wrapcheck
  settings:
    depguard:
      # Enforces the hexagonal layering. Test files are exempt: they may wire real adapters into the core.
      rules:
        domain:
          files:
            - "**/internal/core/domain/**"
          deny:
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal
              desc: the domain must not import other packages of the module
        core:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/adapters
              desc: the core must not depend on adapters
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/backend
              desc: the core must not depend on the composition root
        inbound-adapters:
          files:
            - "**/internal/adapters/inbound/**"
          deny:
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/adapters/outbound
              desc: adapters must not import each other, only the core
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/backend
              desc: adapters must not depend on the composition root
        outbound-adapters:
          files:
            - "**/internal/adapters/outbound/**"
          deny:
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/adapters/inbound
              desc: adapters must not import each other, only the core
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/core/usecases
              desc: repositories implement core ports and must not call use cases
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/backend
              desc: adapters must not depend on the composition root
        fake-adapters:
          files:
            - "**/internal/adapters/outbound/fake/**"
          deny:
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/adapters/outbound/postgres
              desc: the fake and postgres repositories must not import each other
        postgres-adapters:
          files:
            - "**/internal/adapters/outbound/postgres/**"
          deny:
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/adapters/outbound/fake
              desc: the fake and postgres repositories must not import each other
        httpx:
          files:
            - "**/internal/adapters/inbound/httpadapter/httpx/**"
          deny:
            - pkg: github.com/TimoSto/tax-return-organizer/backend/internal/core/usecases
              desc: shared HTTP helpers must not know use cases
    wrapcheck:
      # Errors from within the module are already wrapped or are sentinels.
      ignore-package-globs:
        - github.com/TimoSto/tax-return-organizer/backend/*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
          - gocritic
          - depguard

formatters:
  enable:
    - gofmt
    - goimports
