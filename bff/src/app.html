<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Set the theme before first paint: stored override, else OS preference.
			(function () {
				var theme;
				try {
					theme = localStorage.getItem('theme');
				} catch (e) {}
				if (theme !== 'light' && theme !== 'dark' && theme !== 'high-contrast') {
					theme = matchMedia('(prefers-contrast: more)').matches
						? 'high-contrast'
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				}
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
