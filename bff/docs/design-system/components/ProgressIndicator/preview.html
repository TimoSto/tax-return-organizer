<!-- @dsCard group="Status" height=250 -->
<!doctype html><html lang="de"><head><meta charset="utf-8"></head><body>

<div style="padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:900px">
 <div class="stack" style="gap:24px">
  <div class="stack" style="gap:8px"><div class="row" style="justify-content:space-between"><span class="label-large">Vollständigkeit</span><span class="label-large num">75 %</span></div><div class="md-progress" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Vollständigkeit"><i style="width:75%"></i></div><span class="body-small muted">9 von 12 Unterlagen</span></div>
  <div class="row" style="gap:16px"><span class="md-ring" style="--p:75"><span class="num">75 %</span></span><span class="md-ring" style="--p:40"><span class="num">40 %</span></span><span class="md-ring" style="--p:100"><span class="md-icon" style="font-size:24px;color:var(--primary)">check</span></span></div>
 </div>
 <ol class="md-steps" style="align-self:start">
  <li class="is-done"><span class="md-steps__dot"><span class="md-icon" aria-hidden="true">check</span></span>Unterlagen</li>
  <li class="is-current"><span class="md-steps__dot">2</span>Prüfung</li>
  <li><span class="md-steps__dot">3</span>Freigabe</li>
  <li><span class="md-steps__dot">4</span>Eingereicht</li>
 </ol>
</div>

</body></html>
