<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
	</head>
	<body>
		<div style="padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 32px 24px">
			<div>
				<div class="md-field">
					<input placeholder=" " value="86 095 742 719" id="f1" /><label for="f1">Steuer-ID</label>
				</div>
				<div class="md-field__support">11 Ziffern, steht auf Ihrem Steuerbescheid</div>
			</div>
			<div>
				<div class="md-field md-field--filled">
					<input placeholder=" " value="Lena Fischer" id="f2" /><label for="f2">Name</label>
				</div>
				<div class="md-field__support">Wie beim Finanzamt hinterlegt</div>
			</div>
			<div>
				<div class="md-field is-error">
					<input placeholder=" " value="13.40.2025" id="f3" /><label for="f3">Geburtsdatum</label>
				</div>
				<div class="md-field__support">
					<span class="md-icon" style="font-size: 16px">error</span>Bitte im Format TT.MM.JJJJ
					eingeben
				</div>
			</div>
			<div>
				<div class="md-field">
					<input placeholder=" " id="f4" /><label for="f4">Mieteinnahmen 2025 (€)</label>
				</div>
				<div class="md-field__support">Gesamt, ohne Nebenkosten</div>
			</div>
			<div>
				<div class="md-field has-select">
					<select id="f6">
						<option>Familienstand</option>
						<option selected>Verheiratet</option></select
					><label for="f6">Familienstand</label>
				</div>
			</div>
			<div class="md-field is-disabled">
				<input placeholder=" " value="Nach Einreichung gesperrt" id="f5" disabled /><label for="f5"
					>Status</label
				>
			</div>
		</div>
	</body>
</html>
