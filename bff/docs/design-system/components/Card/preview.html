<!-- @dsCard group="Containment" height=230 -->
<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
	</head>
	<body>
		<div
			style="
				padding: 24px;
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 16px;
				align-items: stretch;
			"
		>
			<div class="md-card md-card--primary stack" style="gap: 4px">
				<span class="label-medium md-card__eyebrow">Erfasste Unterlagen</span
				><span class="numeric-large">9 von 12</span><span class="body-small">3 fehlen noch</span>
			</div>
			<div class="md-card stack" style="gap: 4px">
				<span class="label-medium md-card__eyebrow">Offene Angaben</span
				><span class="numeric-large">4</span><span class="body-small muted">von 8 Angaben</span>
			</div>
			<div class="md-card md-card--outlined stack" style="gap: 4px">
				<span class="label-medium md-card__eyebrow">Personas</span
				><span class="numeric-large">3</span
				><span class="body-small muted">Angestellt, Vermietung, Familie</span>
			</div>
			<div class="md-card md-card--tertiary stack" style="gap: 4px">
				<span class="label-medium md-card__eyebrow">Bitte einreichen bis</span
				><span class="numeric-large">15.07.2025</span><span class="body-small">noch 14 Tage</span>
			</div>
		</div>
	</body>
</html>
